<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sami & Nehir Rüya</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #0b0b0b, #1a0505); 
            color: #f1f1f1; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow-x: hidden; 
        }
        
        /* Romantik Şifre Ekranı */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 11, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
            transition: opacity 0.8s ease;
        }
        .lock-box {
            background: #181010; padding: 35px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(229, 9, 20, 0.25); text-align: center; width: 90%; max-width: 360px;
            border: 1px solid #4a1515;
            animation: floatBox 4s ease-in-out infinite;
        }
        @keyframes floatBox {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .lock-box h2 { margin-bottom: 10px; color: #fff; font-size: 24px; }
        .lock-box p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .lock-box input {
            width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px;
            border: 1px solid #551a1a; background: #221212; color: #fff; font-size: 18px; text-align: center;
            letter-spacing: 3px; outline: none;
        }
        .lock-box input:focus { border-color: #e50914; }
        .lock-box button {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            background: linear-gradient(45deg, #e50914, #ff4d4d); color: white; font-size: 16px; cursor: pointer; font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(229, 9, 20,.4);
        }
        .lock-box button:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(229, 9, 20, 0.6); }
        #error-msg { color: #ff6b6b; margin-top: 12px; font-size: 14px; display: none; font-weight: 500; }

        /* Ana Site İçeriği (Animasyonlu) */
        #main-content {
            display: none; width: 100%; max-width: 750px; padding: 25px;
            text-align: center; animation: popIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1); }
        }

        h1 { font-size: 34px; margin-bottom: 8px; color: #fff; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(229,9,20,0.3); }
        .sub-title { color: #ff4d4d; font-size: 18px; margin-bottom: 35px; font-weight: 600; letter-spacing: 1px; }
        
        .photo-container {
            display: flex; flex-direction: column; gap: 30px; align-items: center; margin-bottom: 30px;
        }
        .photo-card {
            background: #181010; padding: 12px; border-radius: 16px;
            box-shadow: 0 12px 35px rgba(229, 9, 20, 0.2); border: 1px solid #4a1515;
            max-width: 440px; width: 100%; transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .photo-card:hover { 
            transform: translateY(-8px) scale(1.01); 
            box-shadow: 0 18px 45px rgba(229, 9, 20, 0.35);
        }
        .photo-card img {
            width: 100%; height: auto; border-radius: 12px; display: block; object-fit: cover;
        }
        .note {
            font-size: 18px; color: #ddd; line-height: 1.7; background: linear-gradient(145deg, #161010, #1f1212);
            padding: 30px; border-radius: 16px; border-left: 5px solid #e50914;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); border-top: 1px solid #331111;
        }
    </style>
</head>
<body>

    <!-- ŞİFRE EKRANI -->
    <div id="lock-screen">
        <div class="lock-box">
            <h2>Sami & Nehir Rüya 💖</h2>
            <p>Bu özel sayfayı açmak için şifreyi gir:</p>
            <input type="password" id="password-input" placeholder="••••" maxlength="4">
            <button onclick="checkPassword()">Kalplerimizi Birleştir</button>
            <div id="error-msg">Şifre yanlış sevvgilim, tekrar dene! ❤️️</div>
        </div>
    </div>

    <!-- ANA SİTE -->
    <div id="main-content">
        <h1>Sami & Nehir Rüya</h1>
        <div class="sub-title">✨ Sonsuza Kadar Birlikte ✨</div>
        
        <div class="photo-container">
            <div class="photo-card">
                <img src="2344.jpg" alt="Sami ve Nehir Rüya"> 
            </div>
            <div class="photo-card">
                <img src="2012.jpg" alt="Sami ve Nehir Rüya">
            </div>
        </div>

        <div class="note">
            "Gözlerinin baktığı her yer huzur, adının geçtiği her an ömrümün en güzel hikayesi. İyi ki varsın Nehir Rüya..."
        </div>
    </div>

    <script>
        const DOGRU_SIFRE = "1518"; 

        function checkPassword() {
            const girilenSifre = document.getElementById("password-input").value;
            const lockScreen = document.getElementById("lock-screen");
            const mainContent = document.getElementById("main-content");
            const errorMsg = document.getElementById("error-msg");

            if (girilenSifre === DOGRU_SIFRE) {
                lockScreen.style.opacity = '0';
                setTimeout(() => {
                    lockScreen.style.display = 'none';
                    mainContent.style.display = 'block';
                }, 600);
            } else {
                errorMsg.style.display = 'block';
                document.getElementById("password-input").value = "";
            }
        }
        
        document.getElementById("password-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>
</body>
</html>
